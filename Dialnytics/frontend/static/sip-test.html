<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EchoDial SIP Test</title>
<style>
  :root{--bg:#0b0f19;--card:#141f32;--line:#2b3851;--fg:#eef3ff;--fg2:#aab6cf;--muted:#7f8db0;--accent:#6366f1;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;padding:20px}
  .wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
  h1{font-size:19px;margin:0}
  .muted{color:var(--muted);font-size:12.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:11px}
  label{display:grid;gap:5px;font-size:12.5px;color:var(--fg2)}
  input{background:#0e1726;border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font:inherit;width:100%}
  .row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  button{border:1px solid var(--line);background:#1b2740;color:var(--fg);border-radius:9px;padding:10px 15px;font:inherit;font-weight:600;cursor:pointer}
  button.pri{background:var(--accent);border-color:var(--accent)}
  button.call{background:var(--ok);border-color:var(--ok)}
  button.end{background:var(--bad);border-color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.warn{color:var(--warn);border-color:var(--warn)}
  #log{background:#0a1120;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;color:var(--fg2)}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>EchoDial SIP connection test</h1>
    <p class="muted">Sirf test ke liye. Password sirf aap ke browser mein rehta hai, kahin send nahi hota. Mic ki ijazat "Allow" karein.</p>
  </div>

  <div class="card">
    <label>WebSocket (WSS) server
      <input id="wss" value="wss://sip.echodial.ai:5060">
    </label>
    <div class="row">
      <label>SIP username<input id="user" value="dialnytics"></label>
      <label>SIP domain<input id="domain" value="sip.echodial.ai"></label>
    </div>
    <label>Password (yahan likhein — kahin send nahi hoga)
      <input id="pass" type="password" placeholder="echodial password" autocomplete="off">
    </label>
    <label class="muted"><input type="checkbox" id="doReg" style="width:auto;display:inline;margin-right:6px">Pehle REGISTER karein (agar sirf call se na chale to ye tick karein)</label>
    <div class="btns">
      <button class="pri" id="btnConn">Connect</button>
      <button id="btnDisc" disabled>Disconnect</button>
      <span style="margin-left:auto">Status: <span id="state" class="pill warn">idle</span></span>
    </div>
  </div>

  <div class="card">
    <label>Number to call (country code 1 ke saath, bina + ke — jaise 17045978991)
      <input id="dest" value="17045978991" inputmode="numeric">
    </label>
    <div class="btns">
      <button class="call" id="btnCall" disabled>Call</button>
      <button class="end" id="btnHang" disabled>Hang up</button>
    </div>
  </div>

  <div class="card">
    <div class="btns"><b style="font-size:13px">SIP trace (provider ko ye bhejein)</b>
      <button id="btnCopy" style="margin-left:auto">Copy</button>
      <button id="btnClear">Clear</button></div>
    <pre id="trace" style="background:#0a1120;border:1px solid var(--line);border-radius:10px;padding:10px;font:11px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;color:#bcd;margin:0">— Call karne ke baad yahan INVITE aur server ka jawab (405) aayega —</pre>
  </div>
  <div id="log">Loading…</div>
  <audio id="remote" autoplay></audio>
</div>

<script>
// Raw SIP frames tap: JsSIP ke WebSocket ko lapet kar sent/received SIP messages dikhata hai.
(function(){
  var NativeWS = window.WebSocket;
  function stamp(){ return new Date().toLocaleTimeString(); }
  function firstLine(d){ try{ return String(d).split("\r\n")[0].split("\n")[0]; }catch(e){ return ""; } }
  function looksSIP(d){ d=String(d||""); return d.indexOf("SIP/2.0")>=0 || /^(INVITE|REGISTER|ACK|BYE|CANCEL|OPTIONS|INFO|MESSAGE|SUBSCRIBE|NOTIFY) /.test(d); }
  function addTrace(dir,data){
    if(!looksSIP(data)) return;
    var box=document.getElementById('trace'); if(!box) return;
    if(box.dataset.started!=="1"){ box.textContent=""; box.dataset.started="1"; }
    box.textContent += "\n===== "+dir+"  "+stamp()+" =====\n"+String(data).trim()+"\n";
    box.scrollTop=box.scrollHeight;
  }
  function Wrapped(url, protocols){
    var ws = protocols!==undefined ? new NativeWS(url, protocols) : new NativeWS(url);
    var origSend = ws.send.bind(ws);
    ws.send = function(data){ try{ addTrace("SENT (us \u2192 server)", data); }catch(e){} return origSend(data); };
    ws.addEventListener("message", function(ev){ try{ addTrace("RECEIVED (server \u2192 us)", ev.data); }catch(e){} });
    return ws;
  }
  Wrapped.prototype = NativeWS.prototype;
  Wrapped.CONNECTING=NativeWS.CONNECTING; Wrapped.OPEN=NativeWS.OPEN; Wrapped.CLOSING=NativeWS.CLOSING; Wrapped.CLOSED=NativeWS.CLOSED;
  window.WebSocket = Wrapped;
})();
</script>
<script src="jssip.min.js"></script>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const logBox=$('log'); let ua=null, session=null;
  function log(m){ const t=new Date().toLocaleTimeString(); logBox.textContent+="\n["+t+"] "+m; logBox.scrollTop=logBox.scrollHeight; }
  function setState(txt,cls){ const e=$('state'); e.textContent=txt; e.className='pill '+(cls||'warn'); }
  function uiConnected(on){ $('btnConn').disabled=on; $('btnDisc').disabled=!on; $('btnCall').disabled=!on; }
  function uiInCall(on){ $('btnCall').disabled=on; $('btnHang').disabled=!on; }

  if(typeof JsSIP==='undefined'){ logBox.textContent='JsSIP library load nahi hui. Page refresh karein.'; return; }
  logBox.textContent='JsSIP loaded ✓  "Connect" dabayein.';
  try{ JsSIP.debug.enable('JsSIP:*'); }catch(e){}

  $('btnConn').onclick=async()=>{
    const wss=$('wss').value.trim(), user=$('user').value.trim(), domain=$('domain').value.trim(), pass=$('pass').value;
    if(!pass){ log('Password likhein pehle.'); return; }
    try{
      setState('connecting','warn'); log('WebSocket se jud rahe hain: '+wss);
      const socket=new JsSIP.WebSocketInterface(wss);
      ua=new JsSIP.UA({
        sockets:[socket],
        uri:'sip:'+user+'@'+domain,
        authorization_user:user,
        password:pass,
        register:$('doReg').checked,
        session_timers:false
      });
      ua.on('connected', ()=>{ log('WebSocket connected ✓'); setState('connected','ok'); uiConnected(true); });
      ua.on('disconnected', e=>{ log('WebSocket disconnected'+(e&&e.cause?': '+e.cause:'')+(e&&e.code?' (code '+e.code+')':'')); setState('disconnected','bad'); uiConnected(false); uiInCall(false); });
      ua.on('registered', ()=> log('REGISTER ok ✓'));
      ua.on('registrationFailed', e=> log('REGISTER failed: '+(e&&e.cause||'')));
      ua.on('newRTCSession', ev=>{ if(ev.originator==='remote') log('Incoming call (test mein ignore).'); });
      ua.start();
    }catch(e){ log('Connect error: '+(e&&e.message||e)); setState('error','bad'); uiConnected(false); }
  };

  $('btnDisc').onclick=()=>{ try{ ua&&ua.stop(); }catch(e){} log('Disconnected by you.'); setState('idle','warn'); uiConnected(false); uiInCall(false); };

  $('btnCall').onclick=()=>{
    const dest=$('dest').value.replace(/[^\d]/g,''), domain=$('domain').value.trim();
    if(!dest){ log('Number likhein.'); return; }
    const target='sip:'+dest+'@'+domain;
    const handlers={
      progress:()=>{ log('Ringing…'); setState('ringing','warn'); },
      failed:e=>{ log('Call FAILED: '+(e&&e.cause||'')+(e&&e.message&&e.message.status_code?' ('+e.message.status_code+')':'')); setState('connected','ok'); uiInCall(false); },
      ended:e=>{ log('Call ended: '+(e&&e.cause||'')); setState('connected','ok'); uiInCall(false); },
      confirmed:()=>{ log('ANSWERED — awaz honi chahiye ✓'); setState('on call','ok'); }
    };
    try{
      log('Calling '+target+' …'); setState('calling','warn'); uiInCall(true);
      session=ua.call(target,{ eventHandlers:handlers, mediaConstraints:{audio:true,video:false}, pcConfig:{iceServers:[]} });
      session.on('peerconnection', e=>{
        e.peerconnection.ontrack = ev=>{ try{ $('remote').srcObject = ev.streams[0]; }catch(_){ } };
      });
    }catch(e){ log('Call error: '+(e&&e.message||e)); setState('connected','ok'); uiInCall(false); }
  };

  $('btnHang').onclick=()=>{ try{ session&&session.terminate(); }catch(e){ log('Hangup error: '+(e&&e.message||e)); } };
  $('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('trace').textContent); $('btnCopy').textContent='Copied!'; setTimeout(()=>$('btnCopy').textContent='Copy',1500);}catch(e){ const r=document.createRange(); r.selectNode($('trace')); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  $('btnClear').onclick=()=>{ const b=$('trace'); b.textContent='— cleared —'; b.dataset.started=''; };
})();
</script>
</body>
</html>
